name: Home Dashboard
version: "1.0.0"
slug: home_dashboard
description: Vulpo-style Glas-Dashboard für Home Assistant (Ingress, Live-Updates)
url: https://github.com/p-steininger/ha-dashboard-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard
panel_title: Dashboard
homeassistant_api: true
options:
  allow_control: true
  sidebar: b
schema:
  allow_control: bool
  sidebar: list(a|b|c)
